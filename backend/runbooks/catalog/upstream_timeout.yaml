id: "rb-k8s-upstream-timeout"
name: "Upstream Dependency Timeout & Capacity Scaling"
description: "Procedure for mitigating cascading queue saturation and HTTP 504 Gateway Timeouts by scaling out worker replicas."
target_service: "*"
alert_patterns:
  - "HighHttpErrorRate"
  - "UpstreamDependencyTimeout"
  - "ServiceLatencyHigh"
required_symptoms:
  - "latency_p99_elevated"
steps:
  - id: "step-1"
    title: "Verify P99 Latency & 5xx Spikes"
    description: "Confirm P99 latency exceeds SLA baseline (> 1000ms) with concurrent HTTP 504 Gateway Timeout signatures."
    action_type: "CHECK_METRIC"
    command_or_query: "histogram_quantile(0.99, rate(http_request_duration_seconds_bucket[5m]))"
    expected_condition: "latency_p99_ms > 1000"
    is_automated: true

  - id: "step-2"
    title: "Inspect Connection Pool Backlog"
    description: "Check container error logs for timeout or connection pool exhaustion messages."
    action_type: "INSPECT_LOGS"
    expected_condition: "timeout_logs_detected == true"
    is_automated: true

  - id: "step-3"
    title: "Execute Horizontal Deployment Scale-Up"
    description: "Scale target deployment up by 2 replicas to distribute queue load and mitigate database connection backlog."
    action_type: "EXECUTE_REMEDIATION"
    command_or_query: "SCALE_DEPLOYMENT"
    is_automated: false

  - id: "step-4"
    title: "Verify Latency Recovery"
    description: "Assert P99 latency returns below 500ms and HTTP 5xx error rate drops below 1%."
    action_type: "VERIFY_STABILIZATION"
    expected_condition: "error_rate_pct < 1.0"
    is_automated: true
