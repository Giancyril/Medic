replicaCount: 1

image:
  backend:
    repository: ghcr.io/org/incident-agent-backend
    tag: latest
    pullPolicy: IfNotPresent
  frontend:
    repository: ghcr.io/org/incident-agent-frontend
    tag: latest
    pullPolicy: IfNotPresent

service:
  type: ClusterIP
  backendPort: 8000
  frontendPort: 80

ingress:
  enabled: false
  className: "nginx"
  hosts:
    - host: incident-agent.internal
      paths:
        - path: /
          pathType: Prefix

env:
  simulationMode: "false"
  environment: "production"
  prometheusUrl: "http://prometheus-k8s.monitoring.svc:9090"
  slackWebhookUrl: ""
  pagerdutyRoutingKey: ""

resources:
  backend:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi
  frontend:
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi

rbac:
  create: true
  # Scoped cluster permissions for SRE investigation
  clusterRole:
    readPods: true
    readEvents: true
    readDeployments: true
    remediateRollback: true
