global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'service', 'namespace']
  group_wait: 5s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'incident-agent-webhook'

receivers:
- name: 'incident-agent-webhook'
  webhook_configs:
  - url: 'http://backend:8000/api/v1/alerts/webhook'
    send_resolved: true
